<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">清言<span>Translate</span></div>
      <div class="hint" id="status"></div>
    </header>

    <main class="grid">
      <section class="panel" aria-label="原文">
        <div class="panel-head">
          <label class="sr-only" for="srcLang">原文语言</label>
          <select id="srcLang">
            <option value="auto">自动识别</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
          </select>
          <button type="button" id="clearBtn">清空</button>
        </div>
        <label class="sr-only" for="input">输入要翻译的内容</label>
        <textarea id="input" placeholder="输入或粘贴文本…"></textarea>
        <div class="panel-foot">
          <span id="count">0 字</span>
          <button type="button" class="primary" id="translateBtn">翻译</button>
        </div>
      </section>

      <button type="button" class="swap" id="swapBtn" aria-label="交换语言">⇄</button>

      <section class="panel" aria-label="译文">
        <div class="panel-head">
          <label class="sr-only" for="tgtLang">译文语言</label>
          <select id="tgtLang">
            <option value="英语">English</option>
            <option value="中文">中文</option>
            <option value="日语">日本語</option>
            <option value="韩语">한국어</option>
            <option value="西班牙语">Español</option>
            <option value="法语">Français</option>
            <option value="德语">Deutsch</option>
          </select>
          <button type="button" id="copyBtn" disabled>复制</button>
        </div>
        <div id="output" class="empty" aria-live="polite">译文将显示在这里</div>
        <div class="panel-foot">
          <span id="note">仅支持内置示例词典中的句子</span>
        </div>
      </section>
    </main>

  </div>

  <script src="./index.js"></script>
</body>

</html>
